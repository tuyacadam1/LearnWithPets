<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>EduGacha Teacher Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loader" class="loader-overlay hidden">
    <div class="spinner"></div>
  </div>

  <!-- TEACHER LOGIN SCREEN -->
  <div id="login-view" class="auth-container">
    <div class="card auth-card">
      <h1>🎓 TEACHER PORTAL</h1>
      <p>Sign in to manage classes, points & Gacha rewards</p>
      <form id="teacher-login-form">
        <input type="text" id="login-username" required placeholder="Username">
        <input type="password" id="login-password" required placeholder="Password">
        <p id="login-error" class="error-msg"></p>
        <button type="submit" class="btn btn-primary full-width">LOGIN</button>
      </form>
    </div>
  </div>

  <!-- TEACHER DASHBOARD -->
  <div id="dashboard-view" class="container hidden">

    <!-- Top Header Bar -->
    <header class="top-bar">
      <div>
        <h2 id="teacher-welcome">Welcome, Teacher!</h2>
        <span class="sub-text">EduGacha Classroom Control Panel</span>
      </div>
      <div class="header-actions">
        <button id="refresh-teacher-btn" class="btn btn-blue">🔄 REFRESH</button>
        <button id="logout-btn" class="btn btn-danger">LOGOUT</button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tabs-bar">
      <button class="tab-btn active" data-tab="classes">🏫 Classes & Students</button>
      <button class="tab-btn" data-tab="tasks">⭐ Task Points</button>
      <button class="tab-btn" data-tab="gacha">🎰 Gacha Pool</button>
    </nav>

    <!-- TAB 1: CLASSES & STUDENTS -->
    <section id="tab-classes" class="tab-panel">
      <div class="card">
        <h3>Create New Class</h3>
        <form id="add-class-form" class="inline-form">
          <input type="text" id="new-class-name" required placeholder="e.g. Grade 7 - Einstein">
          <button type="submit" class="btn btn-success">+ ADD CLASS</button>
        </form>
      </div>

      <div class="card">
        <div class="section-header">
          <h3>Manage Students</h3>
          <select id="class-selector"></select>
        </div>

        <form id="add-student-form" class="inline-form" style="margin-bottom: 14px;">
          <input type="text" id="new-student-name" required placeholder="Student Full Name">
          <input type="number" id="new-student-points" value="0" min="0" placeholder="Starting ⭐" style="max-width: 130px;">
          <button type="submit" class="btn btn-primary">+ ADD STUDENT</button>
        </form>

        <div id="students-list" class="list-stack"></div>
      </div>
    </section>

    <!-- TAB 2: RECORD TASK POINTS -->
    <section id="tab-tasks" class="tab-panel hidden">
      <div class="card">
        <div class="section-header">
          <h3>Award Task / Quiz Points</h3>
          <select id="task-class-selector"></select>
        </div>

        <form id="bulk-task-form" class="inline-form" style="margin-bottom: 16px;">
          <input type="text" id="task-name-input" required placeholder="Task Name (e.g. Quiz #1)">
          <input type="number" id="task-points-input" required value="10" min="0" placeholder="Points" style="max-width: 120px;">
          <button type="submit" class="btn btn-gold">⭐ AWARD TO WHOLE CLASS</button>
        </form>

        <p class="hint-text">Or record/update individual student scores below:</p>
        <div id="task-students-list" class="list-stack"></div>
      </div>
    </section>

    <!-- TAB 3: GACHA POOL MANAGER -->
    <section id="tab-gacha" class="tab-panel hidden">
      <div class="card">
        <h3>Add New Gacha Creature</h3>
        <form id="add-gacha-form" class="gacha-form">
          <input type="text" id="gacha-name" required placeholder="Creature Name (e.g. Ignis Pup)">
          <select id="gacha-rarity">
            <option value="Common">Common (45%)</option>
            <option value="Uncommon">Uncommon (28%)</option>
            <option value="Rare">Rare (15%)</option>
            <option value="Epic">Epic (8%)</option>
            <option value="Mythic">Mythic (2.5%)</option>
            <option value="Legend">Legend (1%)</option>
            <option value="Secret">🌟 Secret (0.5%)</option>
          </select>
          <select id="gacha-element">
            <option value="Fire">🔥 Fire</option>
            <option value="Nature">🌿 Nature</option>
            <option value="Water">💧 Water</option>
            <option value="Lightning">⚡ Lightning</option>
          </select>
          <input type="file" id="gacha-image-file" accept="image/*" required>
          <button type="submit" class="btn btn-success">+ UPLOAD TO POOL</button>
        </form>
      </div>

      <div class="card">
        <h3>Current Gacha Pool (<span id="pool-count">0</span>)</h3>
        <div id="gacha-pool-grid" class="gacha-grid"></div>
      </div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
