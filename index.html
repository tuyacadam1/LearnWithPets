<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGacha Game Master</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Loading Spinner -->
  <div id="loader" class="loader-overlay hidden">
    <div class="spinner"></div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="login-view" class="auth-container">
    <div class="game-box auth-card">
      <h1>🎮 GAME MASTER</h1>
      <p>Enter your Teacher Credentials</p>
      <form id="login-form">
        <input type="text" id="login-username" required placeholder="Username (e.g. admin)">
        <input type="password" id="login-password" required placeholder="Password">
        <p id="login-error" class="error-msg"></p>
        <button type="submit" class="game-btn btn-green full-width">▶ START GAME</button>
      </form>
    </div>
  </div>

  <!-- GAME LOBBY DASHBOARD -->
  <div id="dashboard-view" class="game-container hidden">
    
    <!-- Top HUD Bar -->
    <header class="hud-bar">
      <div class="hud-title">🎓 <span>EDUGACHA</span></div>
      <div class="hud-user">
        <span id="teacher-display-name">Player 1</span>
        <button id="logout-btn" class="game-btn btn-red btn-sm">EXIT</button>
      </div>
    </header>

    <!-- 4 BIG GAME MENU BUTTONS -->
    <nav class="menu-grid">
      <button class="menu-btn btn-blue active" data-tab="classes">
        <span class="icon">🏰</span>
        <span class="label">CLASSES</span>
      </button>
      <button class="menu-btn btn-purple" data-tab="students">
        <span class="icon">👾</span>
        <span class="label">STUDENTS</span>
      </button>
      <button class="menu-btn btn-gold" data-tab="points">
        <span class="icon">⭐</span>
        <span class="label">POINTS</span>
      </button>
      <button class="menu-btn btn-pink" data-tab="gacha">
        <span class="icon">🎰</span>
        <span class="label">GACHA POOL</span>
      </button>
    </nav>

    <!-- SCREEN 1: CLASSES -->
    <section id="tab-classes" class="tab-panel active">
      <form id="add-class-form" class="game-bar">
        <input type="text" id="new-class-name" placeholder="New Guild / Class Name..." required>
        <button type="submit" class="game-btn btn-green">+ CREATE</button>
      </form>
      <div id="classes-grid" class="cards-grid"></div>
    </section>

    <!-- SCREEN 2: STUDENTS -->
    <section id="tab-students" class="tab-panel hidden">
      <div class="game-bar">
        <select id="student-class-filter" class="class-selector"></select>
        <form id="add-student-form" class="inline-group">
          <input type="text" id="new-student-name" placeholder="Player Name..." required>
          <input type="number" id="new-student-points" placeholder="Pts" value="0" min="0" style="width:80px;">
          <button type="submit" class="game-btn btn-green">+ RECRUIT</button>
        </form>
      </div>
      <div id="students-grid" class="cards-grid"></div>
    </section>

    <!-- SCREEN 3: POINTS -->
    <section id="tab-points" class="tab-panel hidden">
      <div class="game-bar">
        <span class="bar-label">SELECT GUILD:</span>
        <select id="points-class-filter" class="class-selector"></select>
      </div>
      <div id="points-grid" class="cards-grid"></div>
    </section>

    <!-- SCREEN 4: GACHA POOL (UPLOAD BUTTON + 6 RARITY BUTTONS) -->
    <section id="tab-gacha" class="tab-panel hidden">
      <div class="game-box gacha-creator">
        <h3>1. Upload Reward Image</h3>
        <div class="upload-row">
          <label for="gacha-file" class="game-btn btn-blue upload-btn">
            📁 UPLOAD IMAGE
          </label>
          <input type="file" id="gacha-file" accept="image/*" class="hidden">
          <img id="gacha-preview" class="preview-box hidden" alt="Preview">
          <span id="file-status" class="item-meta">No file chosen</span>
        </div>

        <h3 style="margin-top:18px;">2. Click Rarity to Add!</h3>
        <div class="rarity-btn-grid">
          <button type="button" class="game-btn rarity-btn Common" onclick="uploadAndAddGacha('Common')">COMMON<br><small>45%</small></button>
          <button type="button" class="game-btn rarity-btn Uncommon" onclick="uploadAndAddGacha('Uncommon')">UNCOMMON<br><small>28%</small></button>
          <button type="button" class="game-btn rarity-btn Rare" onclick="uploadAndAddGacha('Rare')">RARE<br><small>15%</small></button>
          <button type="button" class="game-btn rarity-btn Epic" onclick="uploadAndAddGacha('Epic')">EPIC<br><small>8%</small></button>
          <button type="button" class="game-btn rarity-btn Mythic" onclick="uploadAndAddGacha('Mythic')">MYTHIC<br><small>3%</small></button>
          <button type="button" class="game-btn rarity-btn Legend" onclick="uploadAndAddGacha('Legend')">LEGEND<br><small>1%</small></button>
        </div>
      </div>

      <div id="gacha-grid" class="cards-grid"></div>
    </section>

  </div>

  <script src="app.js"></script>
</body>
</html>
